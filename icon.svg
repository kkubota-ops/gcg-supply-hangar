<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 背景 -->
  <rect width="512" height="512" rx="96" fill="#07091a"/>
  <!-- オレンジ枠 -->
  <rect x="6" y="6" width="500" height="500" rx="92" fill="none" stroke="#f97316" stroke-width="10"/>

  <!-- 下段カード2枚 -->
  <rect x="96"  y="270" width="140" height="96" rx="14" fill="#1a304d" stroke="#f97316" stroke-width="6"/>
  <rect x="276" y="270" width="140" height="96" rx="14" fill="#1a304d" stroke="#f97316" stroke-width="6"/>

  <!-- 上段カード1枚（中央） -->
  <rect x="186" y="160" width="140" height="96" rx="14" fill="#f97316"/>
  <!-- 上段カード内の「S」マーク -->
  <text x="256" y="234" text-anchor="middle" font-family="monospace" font-size="72" font-weight="bold" fill="#07091a">S</text>

  <!-- 下段左カード内の線 -->
  <line x1="116" y1="308" x2="216" y2="308" stroke="#f97316" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <line x1="116" y1="330" x2="196" y2="330" stroke="#f97316" stroke-width="5" stroke-linecap="round" opacity="0.4"/>

  <!-- 下段右カード内の線 -->
  <line x1="296" y1="308" x2="396" y2="308" stroke="#f97316" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <line x1="296" y1="330" x2="376" y2="330" stroke="#f97316" stroke-width="5" stroke-linecap="round" opacity="0.4"/>

  <!-- HANGAR テキスト -->
  <text x="256" y="430" text-anchor="middle" font-family="monospace" font-size="54" font-weight="bold" letter-spacing="3" fill="#f97316">HANGAR</text>
</svg>
